[package]
name = "chuan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "chuan"
path = "src/main.rs"

[dependencies]
# 只在 `weixin-login` 里把二维码画到终端；不带 image 特性，避免拉进图片编解码
qrcode = { version = "0.14", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
harness-kernel = { workspace = true }
harness-engine = { workspace = true }
harness-store = { workspace = true }
harness-channels = { workspace = true }
harness-capabilities = { workspace = true }
harness-observe = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
libc = "0.2"
async-trait = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
serde = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
