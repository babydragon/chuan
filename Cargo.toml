[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0-rc.18"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
harness-kernel       = { path = "crates/harness-kernel" }
harness-engine       = { path = "crates/harness-engine" }
harness-store        = { path = "crates/harness-store" }
harness-channels     = { path = "crates/harness-channels" }
harness-capabilities = { path = "crates/harness-capabilities" }
harness-observe      = { path = "crates/harness-observe" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "signal"] }
tokio-util = { version = "0.7", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
