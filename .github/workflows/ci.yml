name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 手动触发：Actions 页面点 "Run workflow"，不用为构建而提交
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装沙盒依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 默认用 AppArmor 限制非特权 userns；放开才能跑沙盒测试
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version || echo "bwrap 不可用，沙盒测试会自动跳过"

      - name: 单元与集成测试
        run: cargo test --workspace --all-targets

      - name: 分层守卫（kernel 不得依赖 IO 实现）
        run: python3 scripts/check-layering.py

      # 覆盖过两次真实事故：下载分支后漏 exit（BIN_SRC 未绑定）、--proxy 参数错位
      - name: 安装脚本回归（不需要 root，不联网）
        run: bash scripts/check-install.sh

      # 板上真实事故：unit 的 ProtectKernelTunables=yes 让 bwrap 挂不了 /proc，
      # daemon 照常启动但整个沙盒失效。这里用 unit 里真实的加固项跑一次 bwrap。
      - name: 部署 unit 与 bwrap 兼容性
        run: bash scripts/check-sandbox-unit.sh

  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: riscv64gc-unknown-linux-gnu
            arch: riscv64
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # setup-zig 上游最新 v2.2.1 仍是 node20（仓库里没有 node24 的 release）：
      # 保留会产生一条"Node 20 deprecated"提示，功能不受影响，等上游升级再跟。
      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: 交叉编译
        run: |
          # 后缀锁定 glibc 基线：默认会跟 zig 版本漂，2.28 能覆盖更多发行版
          cargo zigbuild --release --target ${{ matrix.target }}.2.28 --bins
          file target/${{ matrix.target }}/release/chuan
          # glibc 基线：zig 默认 2.28，目标系统应 ≥ 此值
          readelf -V target/${{ matrix.target }}/release/chuan \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -u | tail -3

      - name: 上传二进制
        uses: actions/upload-artifact@v7
        with:
          name: chuan-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/chuan
          if-no-files-found: error
          retention-days: 14

  opentunnel:
    name: opentunnel (riscv64, optional)
    # 可选资产：不阻塞 chuan 发布；失败时 release 继续，install.sh --with-opentunnel 会提示缺包。
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: anomalyco/opentunnel
          # 固定到 tag；下面再校验它对应的 commit，防止 tag 被移动。
          # 升级：同时改 ref、expected commit、asset 版本与 install.sh 测试。
          ref: v0.6.2
          path: opentunnel

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: opentunnel
          key: opentunnel-riscv64

      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: 校验 tag 指向的提交
        run: |
          set -euo pipefail
          cd opentunnel
          test "$(git rev-parse HEAD)" = "1ad859e17924ec3f6741cbc4cdb54ce381c9007c" \
            || { echo "opentunnel tag v0.6.2 指向了意外提交" >&2; exit 1; }

      - name: 交叉编译 opentunnel
        run: |
          set -euo pipefail
          cd opentunnel
          cargo zigbuild --release --locked \
            --target riscv64gc-unknown-linux-gnu.2.28 -p opentunnel-cli
          BIN="target/riscv64gc-unknown-linux-gnu/release/opentunnel"
          file "$BIN"
          readelf -V "$BIN" | grep -o 'GLIBC_2\.[0-9]*' | sort -u | tail -3
          mkdir -p dist
          cp "$BIN" dist/opentunnel
          cp LICENSE dist/LICENSE-opentunnel
          printf 'opentunnel 0.6.2\ntag v0.6.2\ncommit %s\n' "$(git rev-parse HEAD)" > dist/VERSION
          chmod +x dist/opentunnel
          tar -czf chuan-opentunnel-v0.6.2-riscv64-linux-gnu.tar.gz -C dist .
          cp chuan-opentunnel-v0.6.2-riscv64-linux-gnu.tar.gz \
             chuan-opentunnel-riscv64-linux-gnu.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: chuan-opentunnel-riscv64
          path: opentunnel/chuan-opentunnel-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, opentunnel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 打包（二进制 + 安装脚本 + 部署资产）
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p out
          for arch in riscv64 x86_64; do
            dist="dist-$arch"
            mkdir -p "$dist"
            cp "artifacts/chuan-$arch/chuan" "$dist/chuan"
            cp deploy/install.sh deploy/bootstrap-oauth-tunnel.sh \
               deploy/chuan.toml.example \
               deploy/chuan.service deploy/chuan-hostd.service \
               deploy/chuan-backup.service deploy/chuan-backup.timer \
               README.md LICENSE "$dist/"
            # 默认命令条目（D31）与 ipptool 定义：install.sh 会去这两个目录找
            mkdir -p "$dist/commands" "$dist/ipptool"
            cp deploy/commands/*.toml "$dist/commands/"
            cp deploy/ipptool/*.test "$dist/ipptool/"
            chmod +x "$dist/chuan" "$dist/install.sh"
            tar -czf "out/chuan-$TAG-$arch-linux-gnu.tar.gz" -C "$dist" .
            # 稳定别名：让 /releases/latest/download/chuan-<arch>-linux-gnu.tar.gz 永远指向最新
            cp "out/chuan-$TAG-$arch-linux-gnu.tar.gz" "out/chuan-$arch-linux-gnu.tar.gz"
          done
          # 可选 OpenTunnel 资产（job continue-on-error，缺了不影响 chuan 主包）
          if compgen -G "artifacts/chuan-opentunnel-riscv64/*.tar.gz" >/dev/null; then
            cp artifacts/chuan-opentunnel-riscv64/*.tar.gz out/
          fi
          cp deploy/install.sh out/install.sh
          cd out && sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          name: chuan ${{ github.ref_name }}
          # 版本号带 `-` 即视为预发布（v0.2.0-rc.1 / v0.2.0-beta.1）
          # 预发布不会成为 "latest"，所以 /releases/latest/download/ 永远指向最近的稳定版
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            out/*.tar.gz
            out/SHA256SUMS
            out/install.sh
          body: |
            安装（RISC-V 单板机 / x86_64 Linux）：

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo bash
            ```

            或手动下载对应架构的 tar 包，解开后 `sudo ./install.sh`。
            需要 systemd 与 root；安装脚本不会自动启动服务，步骤见脚本末尾提示。

            下载需要代理时（外层取脚本、内层下包是两次请求，都要给）：

            ```bash
            P=http://127.0.0.1:7890
            curl -fsSL -x "$P" https://github.com/${{ github.repository }}/releases/latest/download/install.sh \
              | sudo https_proxy="$P" bash
            ```

            安装**预发布**版本（不会随 `latest` 更新）：

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh \
              | sudo CHUAN_VERSION=${{ github.ref_name }} bash
            ```
