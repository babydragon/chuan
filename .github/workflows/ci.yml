name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 手动触发：Actions 页面点 "Run workflow"，不用为构建而提交
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装沙盒依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 默认用 AppArmor 限制非特权 userns；放开才能跑沙盒测试
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version || echo "bwrap 不可用，沙盒测试会自动跳过"

      - name: 单元与集成测试
        run: cargo test --workspace --all-targets

      - name: 分层守卫（kernel 不得依赖 IO 实现）
        run: python3 scripts/check-layering.py

      # 覆盖过两次真实事故：下载分支后漏 exit（BIN_SRC 未绑定）、--proxy 参数错位
      - name: 安装脚本回归（不需要 root，不联网）
        run: bash scripts/check-install.sh

  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: riscv64gc-unknown-linux-gnu
            arch: riscv64
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: 交叉编译
        run: |
          # 后缀锁定 glibc 基线：默认会跟 zig 版本漂，2.28 能覆盖更多发行版
          cargo zigbuild --release --target ${{ matrix.target }}.2.28 --bins
          file target/${{ matrix.target }}/release/chuan
          # glibc 基线：zig 默认 2.28，目标系统应 ≥ 此值
          readelf -V target/${{ matrix.target }}/release/chuan \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -u | tail -3

      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: chuan-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/chuan
          if-no-files-found: error
          retention-days: 14

  release:
    name: release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 打包（二进制 + 安装脚本 + 部署资产）
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p out
          for arch in riscv64 x86_64; do
            dist="dist-$arch"
            mkdir -p "$dist"
            cp "artifacts/chuan-$arch/chuan" "$dist/chuan"
            cp deploy/install.sh deploy/chuan.toml.example \
               deploy/chuan.service deploy/chuan-backup.service deploy/chuan-backup.timer \
               README.md LICENSE "$dist/"
            chmod +x "$dist/chuan" "$dist/install.sh"
            tar -czf "out/chuan-$TAG-$arch-linux-gnu.tar.gz" -C "$dist" .
            # 稳定别名：让 /releases/latest/download/chuan-<arch>-linux-gnu.tar.gz 永远指向最新
            cp "out/chuan-$TAG-$arch-linux-gnu.tar.gz" "out/chuan-$arch-linux-gnu.tar.gz"
          done
          cp deploy/install.sh out/install.sh
          cd out && sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: chuan ${{ github.ref_name }}
          # 版本号带 `-` 即视为预发布（v0.2.0-rc.1 / v0.2.0-beta.1）
          # 预发布不会成为 "latest"，所以 /releases/latest/download/ 永远指向最近的稳定版
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            out/*.tar.gz
            out/SHA256SUMS
            out/install.sh
          body: |
            安装（RISC-V 单板机 / x86_64 Linux）：

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo bash
            ```

            或手动下载对应架构的 tar 包，解开后 `sudo ./install.sh`。
            需要 systemd 与 root；安装脚本不会自动启动服务，步骤见脚本末尾提示。

            下载需要代理时（外层取脚本、内层下包是两次请求，都要给）：

            ```bash
            P=http://127.0.0.1:7890
            curl -fsSL -x "$P" https://github.com/${{ github.repository }}/releases/latest/download/install.sh \
              | sudo https_proxy="$P" bash
            ```

            安装**预发布**版本（不会随 `latest` 更新）：

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh \
              | sudo CHUAN_VERSION=${{ github.ref_name }} bash
            ```
